services:
  vllm:
    image: vllm/vllm-openai:v0.11.0
    container_name: vllm-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/vllm:/root/.cache/vllm
    # Uncomment the block below if using a gated model
    # Public models like Qwen3-4B need no token.
    # environment:
    #   - HF_TOKEN=${HF_TOKEN:-}
    command: >
      --model Qwen/Qwen3-4B-AWQ
      --quantization awq
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host