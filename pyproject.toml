[project]
name = "job_match_agent"
version = "0.1.0"
description = "Agentic AI tool that ranks Platsbanken job ads against a CV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "responses>=0.26.3",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
